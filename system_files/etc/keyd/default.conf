# Ampersand: Super can also be a leader key (see spec/03 "Keyboard shortcuts").
#
#   Tap Super                     -> Overview, as usual.
#   Super + key                   -> normal Super shortcut (Super+E, Super+T...).
#   Hold Super alone 0.3 s, let go,
#   then press a key              -> the same Super+key shortcut (one-shot Super).
#
# Panic escape: Backspace+Escape+Enter releases the keyboard.
# Apply changes with: sudo keyd reload

[ids]
*

[global]
# The one-shot Super cancels if no key follows within 1.5 s.
oneshot_timeout = 1500

[main]
# Tapped, or another key pressed within 300 ms: plain Super.
# Held alone for 300 ms: one-shot Super, which still works as a held Super too.
leftmeta = timeout(leftmeta, 300, oneshot(meta))
