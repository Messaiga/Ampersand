# Ampersand: Super as a leader key (see spec/03 "Keyboard shortcuts").
#
#   Tap Super, then a letter  -> keyd sends Ctrl+Alt+Super+letter,
#                                which GNOME maps to an app (Settings > Keyboard).
#   Hold Super + key          -> normal Super shortcuts.
#   Super, Super              -> Overview.   Super, Super (hold) -> App grid.
#
# Panic escape: Backspace+Escape+Enter releases the keyboard.
# Apply changes with: sudo keyd reload

[ids]
*

[global]
# Leader cancels if no key follows within 1.5 s.
oneshot_timeout = 1500

[main]
# Tap: leader. Hold: Super (the ":M" below makes unmapped keys Super+key).
leftmeta = oneshot(leader)

[leader:M]
t = C-A-M-t
b = C-A-M-b
w = C-A-M-w
f = C-A-M-f
c = C-A-M-c
i = C-A-M-i
d = C-A-M-d
g = C-A-M-g
k = C-A-M-k
# Second Super: tap opens the Overview, hold (300 ms) opens the app grid.
leftmeta = timeout(leftmeta, 300, M-a)
