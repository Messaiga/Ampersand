---
name: Build disk images

# Builds the installer ISO and a VM disk (qcow2) from the published :stable images.
# Run it from the Actions tab after a new image is out; download from the run's
# Artifacts. Pull requests that touch these files build both, to check they still work.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'iso_files/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "stable"
  # Titanoboa (Universal Blue's live-ISO builder), pinned to the commit Bluefin uses.
  TITANOBOA_COMMIT: "840217d97bd0bc9a52466508c54d8dda5c5ba2fd"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build ISO for ${{ matrix.image-name }}
    # Ubuntu 24.04, as Bluefin's ISO builds use.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image-name: ["ampersand", "ampersand-dx"]  # output of build.yml, keep in sync
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: "true"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Prepare environment
        run: |
          echo "IMAGE_REF=${IMAGE_REGISTRY,,}/${{ matrix.image-name }}" >> "${GITHUB_ENV}"

      # The live ISO carries the same Flatpaks a new install would download at
      # first boot (Bluefin's and ours), read from the image's preinstall.d.
      - name: List the Flatpaks to put on the ISO
        run: |
          set -euo pipefail
          sudo podman pull "${IMAGE_REF}:${DEFAULT_TAG}"
          ctr="$(sudo podman create "${IMAGE_REF}:${DEFAULT_TAG}" /usr/bin/true)"
          mkdir -p "${RUNNER_TEMP}/preinstall.d"
          sudo podman cp "${ctr}:/usr/share/flatpak/preinstall.d/." "${RUNNER_TEMP}/preinstall.d/"
          sudo podman rm "${ctr}"
          sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/preinstall.d"
          iso_files/flatpak-list.sh "${RUNNER_TEMP}"/preinstall.d/*.preinstall | tee "${RUNNER_TEMP}/flatpaks.txt"
          echo "FLATPAKS_LIST=${RUNNER_TEMP}/flatpaks.txt" >> "${GITHUB_ENV}"

      # The hook makes the live system an installer; tell it which image to install.
      - name: Write the ISO hook
        run: |
          set -euo pipefail
          {
            echo "AMPERSAND_IMAGE_REF=${IMAGE_REF}"
            echo "AMPERSAND_IMAGE_TAG=${DEFAULT_TAG}"
            cat iso_files/configure_iso.sh
          } > "${RUNNER_TEMP}/hook.sh"
          echo "HOOK_POST_ROOTFS=${RUNNER_TEMP}/hook.sh" >> "${GITHUB_ENV}"

      # Same Titanoboa call as Bluefin's ISO workflow (projectbluefin/iso).
      - name: Build ISO
        run: |
          set -euo pipefail
          titanoboa_dir="${RUNNER_TEMP}/titanoboa"
          git clone --quiet https://github.com/ublue-os/titanoboa "${titanoboa_dir}"
          git -C "${titanoboa_dir}" checkout --quiet "${TITANOBOA_COMMIT}"

          # Newer just needs the list feature that Titanoboa's Justfile uses.
          sed -i '1a set lists' "${titanoboa_dir}/Justfile"
          just_bin="$(command -v just)"
          sudo \
            env PATH="${PATH}" \
            CI="${CI}" \
            HOOK_post_rootfs="${HOOK_POST_ROOTFS}" \
            TITANOBOA_BUILDER_DISTRO=fedora \
            "${just_bin}" -f "${titanoboa_dir}/Justfile" build \
            "${IMAGE_REF}:${DEFAULT_TAG}" 1 "${FLATPAKS_LIST}" squashfs NONE "${IMAGE_REF}:${DEFAULT_TAG}" 1

          mkdir -p output
          name="${{ matrix.image-name }}-${DEFAULT_TAG}-$(uname -m)"
          sudo mv "${titanoboa_dir}/output.iso" "output/${name}.iso"
          sudo chown -R "$(id -u):$(id -g)" output
          (cd output && sha256sum "${name}.iso" | tee "${name}.iso-CHECKSUM")

      - name: Upload ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image-name }}-iso
          path: output/
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

  qcow2:
    name: Build qcow2 for ${{ matrix.image-name }}
    # Ubuntu 24.04, not 26.04: 26.04's AppArmor/kernel break osbuild's
    # container-deploy step (https://github.com/osbuild/osbuild/issues/2579).
    # Move to 26.04 once that issue is fixed.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image-name: ["ampersand", "ampersand-dx"]  # output of build.yml, keep in sync
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Prepare environment
        run: |
          echo "IMAGE_REF=${IMAGE_REGISTRY,,}/${{ matrix.image-name }}:${DEFAULT_TAG}" >> "${GITHUB_ENV}"

      - name: Build qcow2
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36 # main
        with:
          image_type: qcow2
          bootc_ref: ${{ env.IMAGE_REF }}
          # Bluefin images don't declare a default filesystem; Bluefin installs on btrfs.
          bootc_default_fs: btrfs

      - name: Upload qcow2
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image-name }}-qcow2
          path: output/
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
