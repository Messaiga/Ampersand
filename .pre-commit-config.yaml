# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        # VS Code settings and dev containers are JSONC (comments allowed).
        exclude: '^custom/vscode/'
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: '\.patch$'
      - id: trailing-whitespace
        # A blank context line in a unified diff is a single space; trimming it
        # breaks the patch.
        exclude: '\.patch$'

  # Brewfile validation has exactly one implementation: build/validate-brewfiles.sh.
  # This hook must stay a caller of that script and must never hand a repository
  # Brewfile to `brew bundle` / `brew bundle check` -- Brewfiles are a Ruby DSL,
  # so evaluating a PR-controlled one is code execution in CI.
  # tests/template/precommit-brewfile-hook_test.bats enforces this.
  - repo: local
    hooks:
      - id: validate-brewfiles
        name: Validate Brewfiles
        entry: bash -c 'if command -v brew &> /dev/null; then bash build/validate-brewfiles.sh custom/brew; else echo "⚠️  Homebrew not installed, skipping Brewfile validation"; fi'
        language: system
        files: '^custom/brew/.*\.Brewfile.*$'
        pass_filenames: false
